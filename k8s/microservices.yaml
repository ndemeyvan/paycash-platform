apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-service
  namespace: paycash
  labels:
    app.kubernetes.io/name: partner-service
    app.kubernetes.io/part-of: paycash-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: partner-service
  template:
    metadata:
      labels:
        app: partner-service
        app.kubernetes.io/name: partner-service
        app.kubernetes.io/part-of: paycash-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: partner-service
          image: paycash/partner-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4002
          envFrom:
            - configMapRef:
                name: paycash-backend-config
            - secretRef:
                name: paycash-secrets
          env:
            - name: PORT
              value: "4002"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: partner-service
  namespace: paycash
  labels:
    app.kubernetes.io/name: partner-service
    app.kubernetes.io/part-of: paycash-platform
spec:
  type: ClusterIP
  selector:
    app: partner-service
  ports:
    - name: http
      port: 4002
      targetPort: http
      protocol: TCP
---
