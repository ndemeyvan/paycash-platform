apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: paycash
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: paycash-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/part-of: paycash-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: transaction-service
          image: paycash/transaction-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4001
          envFrom:
            - configMapRef:
                name: paycash-backend-config
            - secretRef:
                name: paycash-secrets
          env:
            - name: PORT
              value: "4001"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: paycash
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: paycash-platform
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
    - name: http
      port: 4001
      targetPort: http
      protocol: TCP
